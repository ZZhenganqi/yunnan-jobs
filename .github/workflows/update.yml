name: 部署到 GitHub Pages

# 说明：抓取不在 CI 上做。
# 实测 GitHub Actions（海外服务器）访问国内政府站点成功率仅 6/20，
# 用它产生的数据会覆盖本地 20/20 的完整结果，导致岗位数量反而变少。
# 因此 CI 只负责「有提交就部署」，数据更新走本地抓取后推送。

on:
  push:
    branches: [main]
  workflow_dispatch:   # 允许手动触发一次部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 清理非发布文件
        run: rm -rf .git .github node_modules scripts config data/prev-ids.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
